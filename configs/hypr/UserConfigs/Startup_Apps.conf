#   #
#Commands & Apps to be executed at launch

$scriptsDir = $HOME/.config/hypr/scripts
$UserScripts = $HOME/.config/hypr/UserScripts

$wallDIR=$HOME/Pictures/wallpapers
$lock = $scriptsDir/LockScreen.sh
$SwwwRandom = $UserScripts/WallpaperAutoChange.sh

# wallpaper stuff / More wallpaper options below
exec-once = swww-daemon --format xrgb
#exec-once = $SwwwRandom $wallDIR # random wallpaper switcher every 30 minutes

# Startup
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user start wallust-manager.service
exec-once = systemctl --user start easyeffects-manager.service
exec-once = systemctl --user start waybar-manager.service
exec-once = systemctl --user start lid-manager.service

# Polkit (Polkit Gnome / KDE)
exec-once = $scriptsDir/Polkit.sh

# starup apps
exec-once = waybar &
exec-once = nm-applet --indicator &
exec-once = easyeffects --gapplication-service &
exec-once = dunst &
exec-once = zsh -c "~/.config/hypr/scripts/Wallust-watcher.sh"
exec-once = zsh -c "~/.config/hypr/scripts/Easyeffects-watcher.sh"
exec-once = zsh -c "~/.config/hypr/scripts/Waybar-watcher.sh"
exec-once = zsh -c "~/.config/hypr/scripts/Lid-watcher.sh"
exec-once = onedrive --monitor --force --resync-auth  --disable-notifications
exec-once = ags &
exec-once = blueman-applet &
#exec-once = rog-control-center &

#clipboard manager
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Rainbow borders
# exec-once = $UserScripts/RainbowBorders.sh &

# Starting hypridle to start hyprlock
exec-once = hypridle &

# Start pyprland daemon
exec-once = pypr &

# G00380316
exec-once = kitty -e "./.config/scripts/tmux-sessioniser.sh"
# exec-once = zsh -c "ollama serve"
exec-once = zsh -c "python3 ~/.config/hypr/UserScripts/Weather.py"
exec-once = XDG_SESSION_TYPE=x11 bluemail --force-device-scale-factor=1.5

# Using this as My Audio controller doesn't work instantly
# exec-once = zsh -c "sleep 2 && pactl set-card-profile alsa_card.pci-0000_00_1f.3-platform-skl_hda_dsp_generic pro-audio && pactl set-card-profile alsa_card.pci-0000_00_1f.3-platform-skl_hda_dsp_generic 'HiFi (HDMI1, HDMI2, HDMI3, Mic1, Mic2, Speaker)'"


