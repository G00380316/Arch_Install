# This is where you put your own keybinds. Be Mindful to check as well ~/.config/hypr/configs/Keybinds.conf to avoid conflict
#
#
#
#
# if you think I should replace the Pre-defined Keybinds in ~/.config/hypr/configs/Keybinds.conf , submit an issue or let me know in DC and present me a valid reason as to why, such as conflicting with global shortcuts, etc etc

# See https://wiki.hyprland.org/Configuring/Keywords/ for more settings and variables
# See also Laptops.conf for laptops keybinds

# /* ---- ✴️ Variables ✴️ ---- */  #
$mainMod = SUPER
$Mod = CTRL
# $fileManager = thunar
$terminal = kitty
$scriptsDir = $HOME/.config/hypr/scripts
$UserScripts = $HOME/.config/hypr/UserScripts

# /* --- G00380316 Variables --- */b`q #
$menu = tofi-drun

$increasevolumeby1 = wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%+
$decreasevolumeby1 = wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%-

# common shortcuts
bind = $mainMod, A, exec, pkill rofi || true && ags -t 'overview' # desktop overview (if installed)
bind = $mainMod, Return, exec, kitty -e "./.config/scripts/tmux-sessioniserRoot.sh"
bind = $mainMod + Alt, S, exec, $menu
bind = $mainMod, V, togglesplit, # dwindle
# bind = $mainMod + SHIFT, S,exec , grim -g "$(slurp)" "$HOME/Pictures/ScreenShots/screenshot_$(date).png"
bind = $mainMod SHIFT, D,exec , $scriptsDir/SetDmWallpaper.sh
bind = $mainMod, D,exec , zsh -c "$scrPath/../../changeSddmTheme.sh"
bind = $mainMod, M,exec , $scriptsDir/MonitorProfiles.sh

# Apps
bind = $Mod + ALT , F,exec , firefox
bind = $Mod + ALT , 0,exec , zsh -c "obs"
bind = $Mod + ALT , 1,exec , pavucontrol
bind = $Mod + ALT , S,exec , env LD_PRELOAD=/usr/lib/spotify-adblock.so spotify --uri=%U

bind = $Mod + ALT , B,exec , bzmenu --launcher rofi
bind = $Mod + ALT , N,exec , iwmenu --launcher rofi
bind = $Mod + ALT , O,exec , obsidian
bind = $Mod + ALT , K,exec , keypunch
# bind = $Mod + ALT , 3,exec, easyeffects
bind = $Mod + ALT , M,exec , XDG_SESSION_TYPE=x11 bluemail --force-device-scale-factor=1.5
bind = $Mod + ALT , E,exec , microsoft-edge-stable --force-device-scale-factor=2 %U
bind = $Mod + ALT , G,exec , google-chrome-stable --force-device-scale-factor=2 %U
bind = $Mod + ALT , V,exec , vesktop
bind = $Mod + ALT , W,exec , kodi --fs --windowing=wayland --audio-backend=pipewire 
bind = $Mod + ALT , 2,exec , firefoxpwa site launch 01JNB5EBVAYXRTGE5F0VT1RZ89 # Youtube Music
bind = $Mod + ALT , Y,exec , firefoxpwa site launch 01JQ5QNGNYN71RKEZBC3PD3Y0T # Youtube

# Volume Control

bind = ALT + SHIFT, 2,exec , $scrPath/volumecontrol.sh -o i
bind = ALT + SHIFT, 4,exec , $scrPath/volumecontrol.sh -o d
bind = ALT + SHIFT, m,exec , $scrPath/volumecontrol.sh -o m
bind = ALT + SHIFT, 1,exec , $increasevolumeby1
bind = ALT + SHIFT, 3,exec , $decreasevolumeby1

# FEATURES / EXTRAS
bind = $mainMod ALT, R, exec, $scriptsDir/Refresh.sh # Refresh waybar, swaync, rofi
bind = $mainMod ALT, E, exec, $scriptsDir/RofiEmoji.sh # emoji menu
bind = $mainMod, I, exec, $scriptsDir/RofiSearch.sh # Google search using rofi
bind = $mainMod ALT, O, exec, $scriptsDir/ChangeBlur.sh # Toggle blur settings
bind = $mainMod SHIFT, G, exec, $scriptsDir/GameMode.sh # Toggle animations ON/OFF
bind = $mainMod ALT, L, exec, $scriptsDir/ChangeLayout.sh # Toggle Master or Dwindle Layout
bind = $mainMod CTRL, R, exec, $scriptsDir/RofiThemeSelector.sh #  Rofi Menu Theme Selector
bind = $mainMod CTRL SHIFT, R, exec, pkill rofi || true && $scriptsDir/RofiThemeSelector-modified.sh # modified Rofi Theme Selector
bind = $mainMod ALT, T, exec, $scriptsDir/DarkLight.sh
bind = $mainMod SHIFT, C, exec, zsh -c "$scriptsDir/Battery-manager.sh toggle"
bind = $mainMod SHIFT, B, exec, zsh -c "$scriptsDir/Battery-manager.sh auto"

bind = $mainMod SHIFT, F, fullscreen # whole full screen
bind = $mainMod CTRL, F, fullscreen, 1 # fake full screen
bind = $mainMod, SPACE, togglefloating, #Float Mode
bind = $mainMod ALT, SPACE, exec, hyprctl dispatch workspaceopt allfloat #All Float Mode

# Waybar / Bar related
bind = $mainMod CTRL ALT, B, exec, pkill -SIGUSR1 waybar # Toggle hide/show waybar
bind = $mainMod CTRL, B, exec, $scriptsDir/WaybarStyles.sh # Waybar Styles Menu
bind = $mainMod ALT, B, exec, $scriptsDir/WaybarLayout.sh # Waybar Layout Menu

# FEATURES / EXTRAS (UserScripts)
bind = $mainMod, slash, exec, $UserScripts/Quick_Settings.sh # Settings Menu  Hyprland Settings
bind = $mainMod SHIFT, M, exec, $UserScripts/RofiBeats.sh # online music using rofi
bind = $mainMod ALT, W, exec, $UserScripts/WallpaperSelect.sh # Select wallpaper to apply
bind = $mainMod SHIFT, W, exec, $UserScripts/WallpaperEffects.sh # Wallpaper Effects by imagemagick
bind = CTRL ALT, R, exec, $UserScripts/WallpaperRandom.sh # Random wallpapers
bind = $mainMod CTRL, O, exec, hyprctl setprop active opaque toggle # disable opacity on active window
bind = $mainMod SHIFT, K, exec, $scriptsDir/KeyBinds.sh # search keybinds via rofi
bind = $mainMod CTRL, A, exec, $scriptsDir/Animations.sh #hyprland animations menu
# bind = $mainMod SHIFT, O, exec, $UserScripts/ZshChangeTheme.sh # Change oh-my-zsh theme
bind = $Mod + ALT, C, exec, $UserScripts/RofiCalc.sh # calculator (qalculate)

# HYDE
bind = $mainMod CTRL, S, exec, hyde-shell screenrecord --start -- --audio --codec libx264 # Screen Record (Audio)
bind = $mainMod ALT, V, exec, hyde-shell screenrecord --start # Screen Record
bind = $mainMod CTRL, D, exec,  screenrecord.sh --quit # Stop Scren Record
bind = $mainMod ALT, M, exec, workflows.sh -S # Select wallpaper to apply
bind = $mainMod ALT, M, exec, workflows.sh -S # Select wallpaper to apply
bind = $mainMod CTRL, T, exec,  shaders.sh -S # Stop Scren Record

# For passthrough keyboard into a VM
# bind = $mainMod ALT, P, submap, passthru
#submap = passthru
# to unbind
#bind = $mainMod ALT, P, submap, reset
#submap = reset
